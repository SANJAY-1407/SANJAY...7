name: task_alert
description: "AlertBox - Premium Task Reminder and Alarm Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  audioplayers: ^6.1.0
  file_picker: ^8.1.4
  path_provider: ^2.1.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/default_alarm.wav

flutter_launcher_icons:
  image_path: "assets/alertbox_icon.png"
  android: true
  ios: false
  min_sdk_android: 21
